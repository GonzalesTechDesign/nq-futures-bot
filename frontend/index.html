<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NQ//FUTURES:BOT — Lucid $50K Eval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Foundation ──────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #00ff41;
            --green-dim: #00cc33;
            --green-dark: #009926;
            --green-glow: rgba(0,255,65,0.25);
            --green-faint: rgba(0,255,65,0.08);
            --green-ghost: rgba(0,255,65,0.03);
            --red: #ff0033;
            --red-dim: #cc0026;
            --red-glow: rgba(255,0,51,0.25);
            --yellow: #e8d44d;
            --yellow-glow: rgba(232,212,77,0.25);
            --bg: #0a0a0a;
            --bg-raised: #0d1117;
            --bg-elevated: #111820;
            --border: rgba(0,255,65,0.12);
            --border-hover: rgba(0,255,65,0.30);
            --text-primary: #00ff41;
            --text-secondary: rgba(0,255,65,0.55);
            --text-muted: rgba(0,255,65,0.25);
            --font-mono: 'Share Tech Mono', monospace;
            --font-display: 'Orbitron', sans-serif;
            --radius-sm: 4px;
            --radius-md: 6px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        html { font-size: 14px; }

        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* ── Matrix Rain Canvas ─────────────────────────────────────── */
        #matrix-rain {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.06;
            pointer-events: none;
        }

        /* ── CRT Scanlines ──────────────────────────────────────────── */
        .scanlines::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,255,65,0.012) 2px,
                rgba(0,255,65,0.012) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Scrollbar ──────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.25); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,65,0.45); }

        /* ── Layout Shell ───────────────────────────────────────────── */
        .app-shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Header ─────────────────────────────────────────────────── */
        .header {
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: sticky; top: 0; z-index: 100;
            padding: var(--space-md) var(--space-xl);
        }
        .header-inner {
            max-width: 1280px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-lg);
        }
        .header-brand {
            display: flex; align-items: center; gap: var(--space-md);
        }
        .header-brand h1 {
            font-family: var(--font-display);
            font-weight: 900; font-size: 1.15rem;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--green-glow);
            white-space: nowrap;
        }
        .header-brand h1 .sep { color: var(--green-dim); }
        .header-brand h1 .colon { color: var(--green-dim); }

        .header-status-line {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: flex; align-items: center; gap: var(--space-sm);
        }
        .header-right {
            display: flex; align-items: center; gap: var(--space-lg);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        /* ── Status Indicators ──────────────────────────────────────── */
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0;
        }
        .status-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .status-dot.off { background: var(--red); box-shadow: 0 0 6px var(--red); }
        .status-dot.warn { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        .status-dot.pulse { animation: dotPulse 1.8s ease-in-out infinite; }

        .conn-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 3px 8px; border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--green-ghost);
        }
        .conn-badge.live { border-color: var(--red-dim); background: rgba(255,0,51,0.06); }

        /* ── Navigation ─────────────────────────────────────────────── */
        .nav-bar {
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0 var(--space-xl);
        }
        .nav-inner {
            max-width: 1280px; margin: 0 auto;
            display: flex; gap: 0; overflow-x: auto;
        }
        .nav-link {
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: var(--space-md) var(--space-lg);
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .nav-link:hover { color: var(--green); }
        .nav-link.active {
            color: var(--green);
            border-bottom-color: var(--green);
            text-shadow: 0 0 8px var(--green-glow);
        }

        /* ── Main Content ───────────────────────────────────────────── */
        .main-content {
            flex: 1;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            padding: var(--space-xl);
        }

        /* ── Panels ─────────────────────────────────────────────────── */
        .panel {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .panel::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,65,0.4), transparent);
            opacity: 0.5;
        }
        .panel:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px var(--green-ghost), inset 0 0 20px var(--green-ghost);
        }
        .panel-inner { padding: var(--space-lg); }
        .panel-header {
            padding: var(--space-lg) var(--space-lg) var(--space-sm);
            display: flex; align-items: center; justify-content: space-between;
        }

        /* ── Typography ─────────────────────────────────────────────── */
        .label-xs {
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .label-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .num-lg {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.45rem;
            letter-spacing: 1px;
        }
        .num-xl {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .text-profit { color: var(--green); text-shadow: 0 0 8px var(--green-glow); }
        .text-loss { color: var(--red); text-shadow: 0 0 8px var(--red-glow); }
        .text-neutral { color: #666; }
        .text-warn { color: var(--yellow); text-shadow: 0 0 8px var(--yellow-glow); }

        /* ── Blinking Cursor ────────────────────────────────────────── */
        .blink::after {
            content: '\2588';
            animation: blinkAnim 1s step-end infinite;
            opacity: 0.6;
            font-size: 0.8em;
            margin-left: 2px;
        }
        @keyframes blinkAnim { 50% { opacity: 0; } }

        /* ── Pulse Text ─────────────────────────────────────────────── */
        .pulse-text {
            animation: textPulse 2.5s ease-in-out infinite;
        }
        @keyframes textPulse {
            0%, 100% { text-shadow: 0 0 4px var(--green-glow); }
            50% { text-shadow: 0 0 16px var(--green-glow), 0 0 32px rgba(0,255,65,0.10); }
        }

        /* ── Progress Bars ──────────────────────────────────────────── */
        .bar-track {
            background: #111;
            border: 1px solid rgba(0,255,65,0.10);
            border-radius: 3px;
            height: 8px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .bar-fill.green {
            background: linear-gradient(90deg, #009926, var(--green));
            box-shadow: 0 0 8px var(--green-glow);
        }
        .bar-fill.yellow {
            background: linear-gradient(90deg, #998800, var(--yellow));
            box-shadow: 0 0 8px var(--yellow-glow);
        }
        .bar-fill.red {
            background: linear-gradient(90deg, #990020, var(--red));
            box-shadow: 0 0 8px var(--red-glow);
        }

        /* ── Badges ─────────────────────────────────────────────────── */
        .badge {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .badge-safe { background: rgba(0,255,65,0.10); color: var(--green); border: 1px solid rgba(0,255,65,0.25); }
        .badge-warn { background: rgba(232,212,77,0.10); color: var(--yellow); border: 1px solid rgba(232,212,77,0.25); }
        .badge-danger { background: rgba(255,0,51,0.10); color: var(--red); border: 1px solid rgba(255,0,51,0.25); }
        .badge-neutral { background: rgba(255,255,255,0.04); color: #666; border: 1px solid rgba(255,255,255,0.08); }
        .badge-live { background: rgba(255,0,51,0.15); color: var(--red); border: 1px solid rgba(255,0,51,0.35); animation: dotPulse 1s ease-in-out infinite; }

        /* ── Grid Layouts ───────────────────────────────────────────── */
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-md); }
        @media (max-width: 900px) {
            .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
            .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .header-inner { flex-wrap: wrap; }
            .header-right { display: none; }
            .main-content { padding: var(--space-md); }
        }

        /* ── Tables ─────────────────────────────────────────────────── */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .data-table th {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding: var(--space-sm) var(--space-md);
            text-align: left;
            font-weight: 400;
            position: sticky; top: 0;
            background: var(--bg-raised);
        }
        .data-table th.r { text-align: right; }
        .data-table th.c { text-align: center; }
        .data-table td {
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid rgba(0,255,65,0.04);
        }
        .data-table td.r { text-align: right; font-variant-numeric: tabular-nums; }
        .data-table td.c { text-align: center; }
        .data-table tr:hover { background: var(--green-ghost); }

        .table-scroll {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        /* ── Buttons ────────────────────────────────────────────────── */
        .btn {
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: var(--space-sm) var(--space-lg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-raised);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            white-space: nowrap;
        }
        .btn:hover {
            border-color: var(--border-hover);
            background: var(--green-ghost);
            box-shadow: 0 0 12px var(--green-ghost);
        }
        .btn:active { transform: scale(0.97); }
        .btn:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }
        .btn-danger {
            border-color: rgba(255,0,51,0.25);
            color: var(--red);
        }
        .btn-danger:hover {
            border-color: rgba(255,0,51,0.5);
            background: rgba(255,0,51,0.06);
            box-shadow: 0 0 12px rgba(255,0,51,0.10);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-sm { padding: 4px var(--space-md); font-size: 0.6rem; }

        /* ── Form Inputs ────────────────────────────────────────────── */
        .input {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }
        .input:focus { border-color: var(--green-dim); box-shadow: 0 0 8px var(--green-ghost); }
        .input::placeholder { color: var(--text-muted); }

        /* ── Toast Notifications ────────────────────────────────────── */
        .toast-container {
            position: fixed;
            top: var(--space-lg);
            right: var(--space-lg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .toast {
            font-size: 0.8rem;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-primary);
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            animation: toastIn 0.25s ease-out;
            display: flex; align-items: center; gap: var(--space-sm);
        }
        .toast.toast-success { border-color: rgba(0,255,65,0.35); }
        .toast.toast-error { border-color: rgba(255,0,51,0.35); color: var(--red); }
        .toast.toast-info { border-color: rgba(0,255,65,0.20); }
        .toast-exit { animation: toastOut 0.2s ease-in forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

        /* ── Modal / Confirm Dialog ─────────────────────────────────── */
        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 9000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.15s;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        .modal-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-xl);
            max-width: 420px;
            width: 90%;
        }
        .modal-box h3 {
            font-family: var(--font-display);
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: var(--space-md);
        }
        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xl);
            line-height: 1.6;
        }
        .modal-actions { display: flex; gap: var(--space-md); justify-content: flex-end; }

        /* ── Loading Spinner ────────────────────────────────────────── */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Empty State ────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: var(--space-2xl) var(--space-xl);
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* ── Tooltip ────────────────────────────────────────────────── */
        [data-tip] { position: relative; cursor: help; }
        [data-tip]:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 8px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            white-space: nowrap;
            color: var(--text-secondary);
            z-index: 500;
            pointer-events: none;
        }

        /* ── View Transitions ───────────────────────────────────────── */
        .view { animation: viewIn 0.2s ease-out; }
        @keyframes viewIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Section Spacing ────────────────────────────────────────── */
        .section-gap { margin-bottom: var(--space-xl); }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-center { display: flex; align-items: center; gap: var(--space-sm); }
        .flex-wrap { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
        .mt-sm { margin-top: var(--space-sm); }
        .mt-md { margin-top: var(--space-md); }
        .mt-lg { margin-top: var(--space-lg); }
        .gap-md { gap: var(--space-md); }
    </style>
</head>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <script>
    (function() {
        'use strict';

        /* ── Constants ───────────────────────────────────────────────── */
        const API_BASE = '';
        const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws';
        const POLL_INTERVAL = 3000;
        const RECONNECT_BASE = 1000;
        const RECONNECT_MAX = 15000;

        /* ── DOM Helpers ─────────────────────────────────────────────── */
        let $ = (sel, root = document) => root.querySelector(sel);
        let $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
        const el = (tag, attrs, children) => {
            const e = document.createElement(tag);
            if (attrs) Object.entries(attrs).forEach(([k,v]) => {
                if (k === 'className') e.className = v;
                else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
                else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
                else if (k === 'dataset') Object.entries(v).forEach(([dk,dv]) => e.dataset[dk] = dv);
                else e.setAttribute(k, v);
            });
            if (children != null) {
                if (typeof children === 'string') e.textContent = children;
                else if (Array.isArray(children)) children.forEach(c => { if (c) e.appendChild(c); });
                else e.appendChild(children);
            }
            return e;
        };

        /* ── Sanitize HTML Interpolations ────────────────────────────── */
        function esc(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* ── Formatting Utilities ────────────────────────────────────── */
        function fmtMoney(v, decimals = 2) {
            const abs = Math.abs(v);
            return '$' + abs.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }
        function fmtSignedMoney(v, decimals = 2) {
            return (v >= 0 ? '+' : '-') + fmtMoney(v, decimals);
        }
        function fmtPct(v) { return v.toFixed(1) + '%'; }
        function pnlClass(v) { return v > 0 ? 'text-profit' : v < 0 ? 'text-loss' : 'text-neutral'; }
        function bufferBadge(status) {
            const map = { SAFE: 'badge-safe', WARNING: 'badge-warn', CRITICAL: 'badge-danger', DANGER: 'badge-danger', LOCKED: 'badge-danger' };
            return map[status] || 'badge-neutral';
        }
        function barColor(pctUsed) {
            if (pctUsed < 40) return 'green';
            if (pctUsed < 70) return 'yellow';
            return 'red';
        }

        /* ── Toast System ────────────────────────────────────────────── */
        function showToast(message, type = 'info', duration = 4000) {
            const container = $('#toast-container');
            const icons = { success: '&#10003;', error: '&#10007;', info: '&#9432;' };
            const toast = el('div', { className: `toast toast-${type}`, role: 'alert' }, [
                el('span', { style: { fontSize: '1.1em' } }, icons[type] || ''),
                el('span', {}, message)
            ]);
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, duration);
        }

        /* ── Modal / Confirm ─────────────────────────────────────────── */
        function showConfirm(title, message) {
            return new Promise(resolve => {
                const backdrop = el('div', { className: 'modal-backdrop', role: 'dialog', 'aria-modal': 'true' });
                const box = el('div', { className: 'modal-box' });
                const h3 = el('h3', {}, title);
                const p = el('p', {}, message);
                const actions = el('div', { className: 'modal-actions' });
                const cancelBtn = el('button', { className: 'btn btn-sm', onClick: () => { backdrop.remove(); resolve(false); } }, 'CANCEL');
                const confirmBtn = el('button', { className: 'btn btn-sm btn-danger', onClick: () => { backdrop.remove(); resolve(true); } }, 'CONFIRM');
                actions.appendChild(cancelBtn);
                actions.appendChild(confirmBtn);
                box.appendChild(h3); box.appendChild(p); box.appendChild(actions);
                backdrop.appendChild(box);
                backdrop.addEventListener('click', e => { if (e.target === backdrop) { backdrop.remove(); resolve(false); } });
                document.body.appendChild(backdrop);
                confirmBtn.focus();
            });
        }

        /* ── API Key Management ──────────────────────────────────────── */
        function getApiKey() {
            let key = sessionStorage.getItem('admin_api_key');
            if (!key) {
                key = prompt('ENTER ADMIN API KEY:');
                if (key) sessionStorage.setItem('admin_api_key', key);
            }
            return key;
        }

        /* ── Fetch Helper ────────────────────────────────────────────── */
        async function apiFetch(path, opts = {}) {
            const url = API_BASE + path;
            const headers = { ...(opts.headers || {}) };
            if (opts.auth) {
                const key = getApiKey();
                if (!key) throw new Error('API key required');
                headers['X-API-Key'] = key;
            }
            if (opts.body && typeof opts.body === 'object') {
                headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(opts.body);
            }
            const res = await fetch(url, { ...opts, headers });
            if (!res.ok) {
                const text = await res.text().catch(() => res.statusText);
                throw new Error(`HTTP ${res.status}: ${text}`);
            }
            return res.json();
        }

        /* ═══════════════════════════════════════════════════════════════ */
        /*  MATRIX RAIN — requestAnimationFrame, performant              */
        /* ═══════════════════════════════════════════════════════════════ */
        const canvas = $('#matrix-rain');
        const ctx = canvas.getContext('2d');
        let rainColumns = [];
        const FONT_SIZE = 14;
        const CHARS = '\u30A2\u30A4\u30A6\u30A8\u30AA\u30AB\u30AD\u30AF\u30B1\u30B3\u30B5\u30B7\u30B9\u30BB\u30BD\u30BF\u30C1\u30C4\u30C6\u30C8\u30CA\u30CB\u30CC\u30CD\u30CE\u30CF\u30D2\u30D5\u30D8\u30DB\u30DE\u30DF\u30E0\u30E1\u30E2\u30E4\u30E6\u30E8\u30E9\u30EA\u30EB\u30EC\u30ED\u30EF\u30F2\u30F30123456789ABCDEF';
        let lastFrameTime = 0;
        const RAIN_FPS = 24; // Cap rain frame rate for performance
        const RAIN_INTERVAL = 1000 / RAIN_FPS;

        function initRain() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const cols = Math.floor(canvas.width / FONT_SIZE);
            rainColumns = new Array(cols);
            for (let i = 0; i < cols; i++) {
                rainColumns[i] = Math.random() * canvas.height / FONT_SIZE | 0;
            }
        }

        function drawRain(timestamp) {
            if (timestamp - lastFrameTime < RAIN_INTERVAL) {
                requestAnimationFrame(drawRain);
                return;
            }
            lastFrameTime = timestamp;

            ctx.fillStyle = 'rgba(10,10,10,0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = FONT_SIZE + 'px monospace';

            for (let i = 0; i < rainColumns.length; i++) {
                const ch = CHARS[Math.random() * CHARS.length | 0];
                const x = i * FONT_SIZE;
                const y = rainColumns[i] * FONT_SIZE;
                // Brighter head character
                ctx.fillStyle = 'rgba(0,255,65,0.95)';
                ctx.fillText(ch, x, y);
                // Dimmer trailing character
                if (rainColumns[i] > 2) {
                    ctx.fillStyle = 'rgba(0,255,65,0.35)';
                    ctx.fillText(CHARS[Math.random() * CHARS.length | 0], x, y - FONT_SIZE);
                }
                if (y > canvas.height && Math.random() > 0.975) {
                    rainColumns[i] = 0;
                }
                rainColumns[i]++;
            }
            requestAnimationFrame(drawRain);
        }

        initRain();
        requestAnimationFrame(drawRain);
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initRain, 200);
        });

        /* ═══════════════════════════════════════════════════════════════ */
        /*  CLOCK                                                        */
        /* ═══════════════════════════════════════════════════════════════ */
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            const s = String(now.getSeconds()).padStart(2,'0');
            const el = $('#hdr-clock');
            if (el) el.textContent = h + ':' + m + ':' + s;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /*  WEBSOCKET & DATA                                             */
        /* ═══════════════════════════════════════════════════════════════ */
        let ws = null;
        let wsReconnectDelay = RECONNECT_BASE;
        let wsReconnectTimer = null;
        let pollTimer = null;
        let lastDashboard = null;
        let activeView = '/';

        const onDataCallbacks = new Set();

        function notifyData(data) {
            lastDashboard = data;
            onDataCallbacks.forEach(fn => fn(data));
        }

        function connectWS() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            try {
                ws = new WebSocket(WS_URL);
            } catch(e) {
                console.warn('WS connect failed:', e);
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                wsReconnectDelay = RECONNECT_BASE;
                setWsStatus(true);
                // Stop polling if WS is live
                stopPolling();
            };

            ws.onmessage = (evt) => {
                try {
                    const data = JSON.parse(evt.data);
                    if (data.type === 'pong') return;
                    notifyData(data);
                } catch(e) { /* ignore malformed */ }
            };

            ws.onclose = () => {
                setWsStatus(false);
                scheduleReconnect();
                startPolling(); // Fallback to polling
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(() => {
                wsReconnectDelay = Math.min(wsReconnectDelay * 1.5, RECONNECT_MAX);
                connectWS();
            }, wsReconnectDelay);
        }

        function setWsStatus(connected) {
            const dot = $('#hdr-ws-dot');
            if (dot) {
                dot.className = 'status-dot ' + (connected ? 'on pulse' : 'off');
            }
        }

        // Polling fallback
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(async () => {
                try {
                    const data = await apiFetch('/api/v1/dashboard');
                    notifyData(data);
                } catch(e) { /* polling error, silent */ }
            }, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        // Initialize connection
        connectWS();

            if (activeView === route) return;

        function onHashChange() {
            const route = getRoute();
            if (activeView === route) return;

            // Cleanup previous view state
            cleanupTvSignals();

            activeView = route;

            $$('.nav-link').forEach(a => {
                a.classList.toggle('active', a.getAttribute('data-route') === route);
            });

            // Render view
            const root = $('#app-root');
            root.innerHTML = '';
            const renderFn = routes[route];
            if (renderFn) {
                try {
                    const view = el('div', { className: 'view' });
                    // Patch $ and $$ to use view as root during render
                    const origDollar = $;
                    const origDollarDollar = $$;
                    $ = (sel, root) => (root || view).querySelector(sel);
                    $$ = (sel, root) => [...(root || view).querySelectorAll(sel)];
                    renderFn(view);
                    $ = origDollar; // Restore
                    $$ = origDollarDollar;
                    root.appendChild(view);
                } catch (e) {
                    logger('VIEW ERROR [' + route + ']: ' + e.message);
                    const view = el('div', { className: 'view' }, [
                        el('div', { className: 'empty-state' }, [
                            el('div', { style: 'color:#ff0033; font-size:0.9rem;' }, '❌ VIEW ERROR'),

                            el('div', { className: 'mt-md', style: 'opacity:0.7;' }, 'Check console for details')
                        ])
                    ]);
                    root.appendChild(view);
                }
            } else {
                const view = el('div', { className: 'view' }, [
                    el('div', { className: 'empty-state' }, '404 — ROUTE NOT FOUND')
                ]);
                root.appendChild(view);
            }
        }

        async function loadTrades() {
            if (tradesState.loading) return;
            tradesState.loading = true;
            const btn = $('#trades-refresh');
            if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
            $('#trades-loading').style.display = '';
            $('#trades-empty').style.display = 'none';
            $('#trades-table-wrap').style.display = 'none';

            try {
                const data = await apiFetch('/api/v1/trades');
                tradesState.data = data;
                renderTradesTable(data);
            } catch(e) {
                showToast('FAILED TO LOAD TRADES: ' + e.message, 'error');
                $('#trades-loading').style.display = 'none';
                $('#trades-empty').style.display = '';
            } finally {
                tradesState.loading = false;
                if (btn) { btn.disabled = false; btn.textContent = 'REFRESH'; }
            }
        }

        function renderTradesTable(data) {
            $('#trades-loading').style.display = 'none';
            const trades = data?.trades || [];
            const filtered = tradesState.filter === 'ALL' ? trades : trades.filter(t => t.side === tradesState.filter);

            const countEl = $('#trades-count');
            if (countEl) countEl.textContent = filtered.length + ' ENTRIES';

            if (!filtered.length) {
                $('#trades-table-wrap').style.display = 'none';
                $('#trades-empty').style.display = '';
                return;
            }

            const tbody = $('#trades-tbody');
            if (!tbody) return;
            $('#trades-empty').style.display = 'none';
            $('#trades-table-wrap').style.display = '';

            tbody.innerHTML = filtered.map(t => {
                const sideColor = t.side === 'BUY' ? 'text-profit' : 'text-loss';
                const ts = t.timestamp ? new Date(t.timestamp).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) : '--';
                return `<tr>
                    <td class="text-neutral">${esc(ts)}</td>
                    <td class="text-profit">${esc(t.symbol)}</td>
                    <td class="${sideColor}" style="font-weight:700">${esc(t.side)}</td>
                    <td class="r">${t.quantity}</td>
                    <td class="r">${fmtMoney(t.price)}</td>
                    <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" data-tip="${esc(t.reason)}">${esc(t.reason)}</td>
                </tr>`;
            }).join('');
        }

        function updateSettingsEvalRef(d) {
            if (activeView !== '/settings' || !d) return;
            const ptEl = $('#s-pt-target');
            if (ptEl && d.profit_target) ptEl.textContent = fmtMoney(d.profit_target.target ?? 0);
            const dllEl = $('#s-dll-limit');
            if (dllEl && d.dll) dllEl.textContent = fmtMoney(d.dll.cumulative_limit ?? 0);
            const consEl = $('#s-consist-rule');
            if (consEl && d.consistency) consEl.textContent = fmtPct(d.consistency.max_day_pct ?? 0);
            // No authoritative daily-loss figure is exposed by the backend payload, so this
            // cell stays '--' rather than stating a stale/hardcoded number.
            const dlEl = $('#s-max-loss');
            if (dlEl) dlEl.textContent = '--';
        }

        async function startBot() {
            const msg = $('#s-control-msg');
            try {
                msg.textContent = 'Sending START command...';
                const res = await apiFetch('/api/v1/control/start', {
                    method: 'POST',
                    body: { mode: 'PAPER' },
                    auth: true
                });

        async function runReconciliation() {
            const result = $('#sys-recon-result');

            try {

                let html = `<div class="flex-center" style="margin-bottom:var(--space-lg)"><span class="badge ${statusCls}" style="font-size:0.7rem; padding:4px 12px">${esc(status)}</span>`;

                if (bpos.length) {
                    html += '<div style="margin-bottom:var(--space-md)"><div class="label-xs" style="margin-bottom:var(--space-sm)">BROKER POSITIONS</div>';
                    bpos.forEach(p => {
                        const side = p.quantity > 0 ? 'LONG' : p.quantity < 0 ? 'SHORT' : 'FLAT';
                        const cls = p.quantity > 0 ? 'text-profit' : p.quantity < 0 ? 'text-loss' : 'text-neutral';

                            <span class="text-neutral" style="margin-left:var(--space-sm)">avg $${(p.avg_price || 0).toFixed(2)}</span>

                    html += '<div class="label-label" style="margin-bottom:var(--space-md)">NO BROKER POSITIONS</div>';

                // Discrepancies

                    html += '<div><div class="label-xs" style="margin-bottom:var(--space-sm); color:var(--red)">DISCREPANCIES FOUND</div>';

        /*  VIEW: TRADINGVIEW SIGNALS                                    */

        let tvSignalsInterval = null;
        let tvSignalsLoading = false;

        function cleanupTvSignals() {
            if (tvSignalsInterval) { clearInterval(tvSignalsInterval); tvSignalsInterval = null; }
        }

        /* ── Safe raw-payload preview (never surfaces the webhook token) ── */
        const TV_RAW_ALLOW_KEYS = [
            'open', 'high', 'low', 'close', 'volume', 'time', 'datetime',
            'ticker', 'interval', 'strategy', 'strategy_name', 'alert_name', 'comment'
        ];
        const TV_RAW_MAX_LEN = 200;

        function stripTokenKeys(value) {
            if (Array.isArray(value)) return value.map(stripTokenKeys);
            if (value && typeof value === 'object') {
                const out = {};
                Object.keys(value).forEach(k => {
                    // Exclude ANY key whose name is 'token' (case-insensitive), nested or not.
                    if (k.toLowerCase() !== 'token') out[k] = stripTokenKeys(value[k]);
                });
                return out;
            }
            return value;
        }

        function safeRawPreview(raw) {
            if (!raw) return '';
            let parsed;
            try {
                parsed = JSON.parse(raw);
            } catch (e) {
                return '--'; // Unparseable body — never slice the raw string into view (it may carry the token).
            }
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return '--';
            const clean = stripTokenKeys(parsed);
            // Render ONLY explicitly-allowed chart-data keys; everything else is dropped.
            const parts = Object.keys(clean)
                .filter(k => TV_RAW_ALLOW_KEYS.includes(k))
                .map(k => k + ':' + JSON.stringify(clean[k]));
            if (!parts.length) return '--';
            const preview = parts.join(', ');
            return preview.length > TV_RAW_MAX_LEN ? preview.slice(0, TV_RAW_MAX_LEN) + '…' : preview;
        }

        function renderTvSignals(container) {
            // The webhook secret lives server-side in .env — never ship it in client code.
            // TradingView cannot send custom headers, so the URL must carry ?token=... which
            // the operator appends by hand (see the instruction box below).
            // Build webhook URL — prefer ngrok when configured (set NGROK_HOST in .env)
            const d = lastDashboard || {};
            const ngrok = d.ngrok_host || '';
            const baseUrl = ngrok
                ? 'https://' + ngrok + '/api/v1/webhook/tradingview'
                : location.origin + '/api/v1/webhook/tradingview';
            const webhookUrl = baseUrl; // tokenless — user appends ?token=SERVER_SECRET

            container.innerHTML = `
                <!-- Webhook URL Box -->
                <div class="panel section-gap">
                    <div class="panel-header">
                        <span class="label-xs">Webhook Endpoint</span>
                        <button id="tv-copy-url" class="btn btn-sm">COPY URL</button>
                    </div>
                    <div style="padding:0 var(--space-lg) var(--space-lg)">
                        <div class="mt-sm" style="padding:var(--space-md); background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border); font-family:var(--font-mono); font-size:0.75rem; color:var(--green); word-break:break-all; letter-spacing:0.5px; line-height:1.6;">
                            <span class="label-label" style="display:block; margin-bottom:var(--space-xs); letter-spacing:2px;">PASTE THIS INTO TRADINGVIEW WEBHOOK SETTINGS:</span>
                            <span id="tv-webhook-url">${esc(webhookUrl)}</span>
                            <div class="label-label mt-sm" style="letter-spacing:1px; color:var(--text-secondary); margin-top:var(--space-sm);">
                                APPEND <span style="color:var(--yellow)">?token=YOUR_WEBHOOK_SECRET</span> (the value of WEBHOOK_SECRET in your .env)
                            </div>
                    </div>
                </div>

                <!-- Header + Test Signal Form -->
                <div class="panel section-gap">
                    <div class="panel-header">
                        <span class="label-xs">TradingView Signal Feed</span>
                        <div class="flex-center">
                            <span class="label-label" id="tv-signal-count">0 SIGNALS</span>
                            <span class="label-label" id="tv-last-refresh">--</span>
                            <button id="tv-send-test" class="btn btn-sm">SEND TEST SIGNAL</button>
                        </div>
                    </div>
                    <div style="padding:0 var(--space-lg) var(--space-lg)">
                        <!-- Test Signal Form (hidden by default) -->
                        <div id="tv-test-form" style="display:none; padding:var(--space-md); background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:var(--space-lg);">
                            <div class="label-xs" style="margin-bottom:var(--space-md)">TRIGGER TEST SIGNAL</div>
                            <div class="flex-center" style="gap:var(--space-md); flex-wrap:wrap;">
                                <select id="tv-test-action" class="input" style="font-size:0.7rem; padding:6px 10px;">
                                    <option value="BUY">BUY</option>
                                    <option value="SELL">SELL</option>
                                    <option value="FLATTEN">FLATTEN</option>
                                </select>
                                <input type="text" id="tv-test-symbol" class="input" placeholder="SYMBOL" value="NQ" style="font-size:0.7rem; padding:6px 10px; width:100px;">
                                <input type="number" id="tv-test-qty" class="input" placeholder="QTY" value="2" min="1" style="font-size:0.7rem; padding:6px 10px; width:80px;">
                                <button id="tv-test-send" class="btn btn-sm">FIRE</button>
                                <button id="tv-test-cancel" class="btn btn-sm" style="opacity:0.5">CANCEL</button>
                            </div>
                        </div>
                        <!-- Signals Table -->
                        <div id="tv-loading" class="empty-state" style="display:none">
                            <div class="spinner"></div>
                            <div class="mt-sm">LOADING SIGNALS...</div>
                        </div>
                        <div id="tv-empty" class="empty-state">
                            NO SIGNALS YET
                        </div>
                        <div id="tv-table-wrap" class="table-scroll" style="display:none">
                            <table class="data-table">
                                <thead><tr>
                                    <th>TIME</th><th>ACTION</th><th>SYMBOL</th>
                                    <th class="r">QTY</th><th>STATUS</th><th>REASON</th>
                                    <th class="r">EXEC PRICE</th><th>CHART DATA</th>

                                <tbody id="tv-tbody"></tbody>
                            </table>

                    </div>
                </div>
            `;

            // Copy URL
            $('#tv-copy-url').addEventListener('click', () => {
                navigator.clipboard.writeText(webhookUrl).then(() => {
                    showToast('Webhook URL copied to clipboard', 'success');
                }).catch(() => {
                    showToast('Copy failed — select the URL manually', 'error');
                });
            });

            // Toggle test form
            $('#tv-send-test').addEventListener('click', () => {
                const form = $('#tv-test-form');
                form.style.display = form.style.display === 'none' ? '' : 'none';
            });
            $('#tv-test-cancel').addEventListener('click', () => {
                $('#tv-test-form').style.display = 'none';
            });
            $('#tv-test-send').addEventListener('click', sendTestSignal);

            // Load immediately, then poll every 5s
            loadTvSignals();
            tvSignalsInterval = setInterval(loadTvSignals, 5000);
        }

        async function loadTvSignals() {
            if (tvSignalsLoading || activeView !== '/tv-signals') return;
            tvSignalsLoading = true;
            try {
                const data = await apiFetch('/api/v1/webhook/signals', { auth: true });
                renderTvSignalsTable(data);
                const lu = $('#tv-last-refresh');
                if (lu) lu.textContent = 'UPDATED: ' + new Date().toLocaleTimeString('en-US', { hour12: false });
            } catch(e) {
                const loading = $('#tv-loading');
                const empty = $('#tv-empty');
                if (loading) loading.style.display = 'none';
                if (empty && !empty.dataset.loaded) {
                    empty.textContent = 'CONNECTION ERROR — ' + esc(e.message);
                    empty.style.color = 'var(--red)';
                }
            } finally {
                tvSignalsLoading = false;
            }
        }

        function renderTvSignalsTable(data) {
            const loading = $('#tv-loading');
            const empty = $('#tv-empty');
            const wrap = $('#tv-table-wrap');
            if (loading) loading.style.display = 'none';

            const signals = data?.signals || [];
            const countEl = $('#tv-signal-count');
            if (countEl) countEl.textContent = signals.length + ' SIGNAL' + (signals.length !== 1 ? 'S' : '');

            if (!signals.length) {
                if (wrap) wrap.style.display = 'none';
                if (empty) { empty.style.display = ''; empty.textContent = 'NO SIGNALS YET'; empty.style.color = ''; empty.dataset.loaded = '1'; }
                return;
            }

            if (empty) empty.style.display = 'none';
            if (wrap) wrap.style.display = '';

            const tbody = $('#tv-tbody');
            if (!tbody) return;

            tbody.innerHTML = signals.map(s => {
                const ts = s.timestamp ? new Date(s.timestamp).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) : '--';
                const actionCls = s.parsed_action === 'BUY' ? 'text-profit' : s.parsed_action === 'SELL' ? 'text-loss' : 'text-warn';
                let statusBadge;
                if (s.status === 'EXECUTED') statusBadge = '<span class="badge badge-safe">EXECUTED</span>';
                else if (s.status === 'REJECTED') statusBadge = '<span class="badge badge-danger">REJECTED</span>';
                else if (s.status === 'BLOCKED') statusBadge = '<span class="badge badge-warn">BLOCKED</span>';
                else statusBadge = '<span class="badge badge-neutral">' + esc(s.status || 'UNKNOWN') + '</span>';

                const execPrice = s.execution_price != null ? fmtMoney(s.execution_price) : '--';
                const reason = s.reject_reason || s.alert_name || s.strategy_name || '--';
                // Show raw payload preview (chart data from TradingView).
                // The backend persists the raw body verbatim — which may include the webhook
                // token (body-token auth) — so render ONLY the explicit allow-list above, with
                // any 'token' key (case-insensitive) stripped. Never echo raw text we didn't vet.
                const rawPreview = safeRawPreview(s.raw_payload);

                return `<tr>
                    <td class="text-neutral">${esc(ts)}</td>
                    <td class="${actionCls}" style="font-weight:700">${esc(s.parsed_action || '--')}</td>
                    <td class="text-profit">${esc(s.parsed_symbol || '--')}</td>
                    <td class="r">${esc(String(s.parsed_qty ?? '--'))}</td>
                    <td>${statusBadge}</td>
                    <td style="max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" data-tip="${esc(reason)}">${esc(reason)}</td>
                    <td class="r">${esc(execPrice)}</td>
                    <td style="max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.7rem; color:var(--text-secondary)" data-tip="${esc(rawPreview)}">${esc(rawPreview || '--')}</td>
                </tr>`;
            }).join('');
        }

        async function sendTestSignal() {
            const action = $('#tv-test-action').value;
            const symbol = $('#tv-test-symbol').value.trim();
            const qty = parseInt($('#tv-test-qty').value, 10);

            if (!symbol) { showToast('Enter a symbol', 'error'); return; }
            if (!qty || qty < 1) { showToast('Enter a valid quantity', 'error'); return; }

            const btn = $('#tv-test-send');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                await apiFetch('/api/v1/webhook/test', {
                    method: 'POST',
                    body: { action: action, symbol: symbol, quantity: qty },
                    auth: true
                });
                showToast('Test signal sent: ' + action + ' ' + symbol + ' x' + qty, 'success');
                $('#tv-test-form').style.display = 'none';
                setTimeout(loadTvSignals, 800);
            } catch(e) {
                showToast('TEST SIGNAL FAILED: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'FIRE';
            }
        }

        onHashChange();

    })();
